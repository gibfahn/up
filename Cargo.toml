# Make this a workspace so that path dependencies below share the same lockfile.
[workspace]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/gibfahn/up"
keywords = ["cli", "tool"]
categories = ["command-line-utilities", "config"]
readme = "README.md"
authors = ["Gibson Fahnestock <gibfahn@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

# up is the root package in this workspace.
[package]
name = "up"
version = "0.18.1"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

description = """
up is a tool to help you keep your machine up to date.
"""
documentation = "https://docs.rs/crate/up"
homepage = "https://github.com/gibfahn/up"
exclude = ["tests/"]

[[bin]]
name = "up"
path = "src/main.rs"

[dependencies]
camino = { version = "1.2.5", features = ["serde1"] }
chrono = "0.4.45"
clap = { version = "4.6.6", features = [
  "derive",
  "env",
  "string",
  "wrap_help",
] }
clap_complete = "4.6.9"
color-eyre = "0.6.5"
dirs = "7.0.0"
displaydoc = "0.2.7"
duct = "1.1.2"
envy = "0.4.2"
git2 = { version = "0.21.0", features = [
  "ssh",
  "https",
  "vendored-openssl",
  "vendored-libgit2",
] }
hex = "0.4.3"
itertools = "0.15.0"
indicatif = { version = "0.18.6", features = ["rayon"] }
nix = { version = "0.31", features = ["fs", "process", "term", "user"] }
plist = "1.10.1"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
ring = "0.17.14"
schemars = "1.2.2"
semver = "1.0.28"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
shell-escape = "0.1.5"
shellexpand = "3.1.2"
thiserror = "2.0.20"
toml = "1.1.5"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uzers = "0.12.2"
walkdir = "2.5.0"
tracing-indicatif = "0.3.14"
clap-markdown = "0.1.5"
clap_mangen = "0.3.3"
pretty_assertions = "1.4.1"

[dev-dependencies]
assert_cmd = "2.2.2"
glob = "0.3.4"
ignore = "0.4.33"
predicates = "3.1.4"
serial_test = "4.0.1"
test-log = { version = "0.2.21", default-features = false, features = [
  "trace",
] }
testutils = { path = "./tests/testutils" }
